name: Deploy .NET 8 App to MonsterASP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Publish Application
      run: dotnet publish EStore.csproj -c Release -o ./publish

    - name: Delete locked DLL on server
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq lftp
        lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" site75763.siteasp.net <<EOF
        set ssl:verify-certificate no
        set ftp:ssl-force true
        set ftp:ssl-protect-data true
        cd /wwwroot
        rm -f EStore.dll
        bye
        EOF
      continue-on-error: true

    - name: Deploy via FTP to MonsterASP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: site75763.siteasp.net
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /wwwroot/
        protocol: ftps
        port: 21
        security: loose